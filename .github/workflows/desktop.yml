name: App de escritorio (Windows)

on:
  workflow_dispatch:
  push:
    paths: ['desktop/**', '.github/workflows/desktop.yml']
    tags: ['desktop-v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx electron-builder --win nsis portable --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Capri-Windows
          path: desktop/dist/*.exe
      - name: Publicar descarga
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          name: Capri de escritorio ${{ github.ref_name }}
          files: desktop/dist/*.exe
          body: |
            Descarga **Capri-Setup** para instalarla, o **Capri-portable** para usarla sin instalar.
            Windows puede avisar "Windows protegió su PC": toca "Más información" y luego "Ejecutar de todas formas".
