<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Capri · Bóveda</title>
<script src="boveda.js"></script>
<style>
:root{--bg:#07070a;--ink:#f2f0f5;--mut:#8d8a99;--yel:#ffe600;--cyan:#2de2e6;--red:#ff2a4d;--mono:'JetBrains Mono','Share Tech Mono',Consolas,monospace;--sans:'Space Grotesk',system-ui,'Segoe UI',sans-serif}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);display:grid;place-items:center;padding:16px;
 background-image:radial-gradient(900px 500px at 85% -5%,rgba(255,42,77,.18),transparent 60%),radial-gradient(800px 500px at -5% 105%,rgba(45,226,230,.12),transparent 60%),
 linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:auto,auto,32px 32px,32px 32px}
.p{width:min(440px,100%);border:1px solid var(--red);background:#0d0c11;padding:26px 24px;clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,16px 100%,0 calc(100% - 16px))}
h1{font:700 13px var(--mono);letter-spacing:.3em;color:var(--red);margin:0 0 4px}h2{font:600 22px var(--sans);margin:0 0 14px}
small{color:var(--mut);font-size:12px;line-height:1.5;display:block}
input{width:100%;margin:12px 0 8px;padding:11px 12px;background:#000;border:1px solid #2a2733;color:var(--ink);font:15px var(--mono);outline:none}
input:focus{border-color:var(--cyan)}
button{width:100%;padding:11px;border:1px solid var(--cyan);background:rgba(45,226,230,.08);color:var(--cyan);font:700 13px var(--mono);letter-spacing:.1em;cursor:pointer}
button:disabled{opacity:.5;cursor:wait}
.l{background:none;border:0;color:var(--mut);font:12px var(--mono);letter-spacing:0;padding:8px 0 0;text-align:left;text-decoration:underline;width:auto}
#msg{min-height:18px;margin-top:10px;font:12px var(--mono);color:var(--mut)}#msg.e{color:var(--red)}
.bar{display:flex;justify-content:space-between;margin-top:14px}
</style></head><body>
<form class="p" id="f" autocomplete="off">
 <h1>BÓVEDA // CAPRI</h1><h2 id="tt">Tu llave, choom</h2>
 <small id="sub">Tus datos están cifrados. Con tu llave los descifro solo en la memoria; en el disco nunca quedan legibles.</small>
 <input id="k" type="password" autofocus placeholder="Llave" autocomplete="current-password">
 <div id="nv" hidden><small>Entraste con el código de recuperación. Pon una llave nueva:</small>
  <input id="n1" type="password" placeholder="Llave nueva (8+ caracteres)"><input id="n2" type="password" placeholder="Repite la llave nueva"></div>
 <label id="rr" style="display:none;gap:8px;align-items:center;margin:0 0 10px;cursor:pointer"><input type="checkbox" id="rcd" style="width:auto;margin:0"><small>Recordarme en esta PC (abre sin pedir la llave)</small></label>
 <button id="go">ABRIR</button>
 <div id="msg"></div>
 <div class="bar"><button type="button" class="l" id="rec">Olvidé mi llave: usar código de recuperación</button><button type="button" class="l" id="out">Salir</button></div>
</form>
<script>
(async()=>{
const $=id=>document.getElementById(id),D=window.capriDesk?.boveda,B=window.Boveda;
const next=new URLSearchParams(location.search).get('next')||'index.html';
const ir=()=>{let u='index.html';try{const x=new URL(next,location.href);if(x.origin===location.origin)u=x.href;}catch(e){}location.replace(u);};
if(!D||!B){ir();return;}
window.capriDesk.mode?.('full');   // que la ventana se muestre y reciba el teclado
const inf=await D.info();if(!inf.creada){ir();return;}
let codigo=false,raw=null;
const msg=(t,e)=>{$('msg').textContent=t;$('msg').className=e?'e':'';};
// esta PC te recuerda: se abre sola, sin llave
const rec=await D.recordando?.().catch(()=>null);if(rec?.puede)$('rr').style.display='flex';
if(rec?.si){const r=await D.recordada().catch(()=>null);
  if(r){const x=B.deb64(r);if(await B.probar(await B.maestra(x))){raw=x;$('tt').textContent='Hola de nuevo, choom';$('k').hidden=true;$('rr').style.display='none';$('rec').hidden=true;return entrar();}}
  await D.olvidar();msg('Esta PC ya no reconoce tu bóveda: escribe tu llave.',true);}
$('out').onclick=()=>D.salir();
$('rec').onclick=()=>{codigo=!codigo;$('k').value='';$('k').type=codigo?'text':'password';$('k').placeholder=codigo?'Código de recuperación (XXXX-XXXX-…)':'Llave';
  $('rec').textContent=codigo?'Mejor uso mi llave':'Olvidé mi llave: usar código de recuperación';$('tt').textContent=codigo?'Código de recuperación':'Tu llave, choom';msg('');$('k').focus();};
async function entrar(){$('go').disabled=true;
  try{const malos=await B.cargarTodo(await B.maestra(raw),t=>msg(t));
    sessionStorage.setItem('capri_boveda_k',B.b64(raw));
    if($('rcd').checked)await D.recordar(B.b64(raw)).catch(()=>{});
    if(malos.length&&!confirm('No pude descifrar esto (archivo dañado o incompleto):\n\n'+malos.join('\n')+'\n\n¿Entrar de todos modos? Lo demás está bien. Si guardas cambios en esas partes, se reemplazan.')){D.salir();return;}
    msg('Listo. Despertando a Capri…');ir();}
  catch(e){msg('No pude abrir tus datos: '+(e.message||e),true);$('go').disabled=false;}}
$('f').onsubmit=async e=>{e.preventDefault();
  if(raw){const n1=$('n1').value;if(n1.length<8||n1!==$('n2').value)return msg('La llave nueva necesita 8+ caracteres y coincidir.',true);
    $('go').disabled=true;msg('Guardando tu llave nueva…');await B.ponerLlave(raw,n1);return entrar();}
  const v=$('k').value;if(!v)return;$('go').disabled=true;msg('Comprobando…');
  try{raw=await B.desbloquear(inf.meta,v,codigo);}catch(e){raw=null;$('go').disabled=false;$('k').select();return msg(codigo?'Ese código no es.':'Esa llave no es.',true);}
  if(codigo){$('nv').hidden=false;$('k').hidden=true;$('rec').hidden=true;$('go').disabled=false;$('go').textContent='GUARDAR LLAVE Y ABRIR';msg('');$('n1').focus();return;}
  entrar();};
})();
</script></body></html>
